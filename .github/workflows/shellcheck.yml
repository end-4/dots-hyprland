name: ShellCheck

on:
  push:
    branches: [main]
    paths:
      - 'tools/**'
      - 'sdata/subcmd-smart-organizer/**'
      - '.github/workflows/**'
  pull_request:
    branches: [main]
    paths:
      - 'tools/**'
      - 'sdata/subcmd-smart-organizer/**'
      - '.github/workflows/**'
  workflow_dispatch:

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run ShellCheck
        run: |
          set -euo pipefail
          echo "Installing shellcheck..."
          sudo apt-get update
          sudo apt-get install -y shellcheck
          shellcheck --version

          echo "Finding shell scripts..."
          scripts=$(find . -not -path "./.git/*" -not -path "./dots/*" -type f \( -name "*.sh" -o -name "setup" -o -name "diagnose" -o -name "uninstall" \) )
          echo "Found scripts: $scripts"

          if [[ -z "$scripts" ]]; then
            echo "No shell scripts found to check"
            exit 0
          fi

          exit_code=0
          for script in $scripts; do
            echo "Checking: $script"
            if ! shellcheck -x -S error "$script"; then
              echo "FAILED: $script"
              exit_code=1
            fi
          done

          if [[ $exit_code -eq 0 ]]; then
            echo "All shell scripts passed ShellCheck"
          else
            echo "Some shell scripts failed ShellCheck"
            exit 1
          fi
